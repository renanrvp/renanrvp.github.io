  <body>
    <h1>VODAFONE</h1>
    <div id="container"></div>
    <script>
      const appName = "c:stcExternalApprovalAuraContainer";
      const componentName = "c:stcExternalApprovalContainer";
      const lightningEndpoint = "https://syn--vlocrenan.sandbox.my.site.com";
      const targetElement = document.querySelector("#container");

      const urlParams = new URLSearchParams(window.location.search);
      if(urlParams.has('qId') && urlParams.has('action')) {
        const uuid = urlParams.get('qId');
        const action = urlParams.get('action');
        const componentAttributes = {
          "uuid" : uuid,
          "action" : action
        };
        
        $Lightning.use(appName, function () {
          $Lightning.createComponent(
            componentName,
            componentAttributes,
            targetElement,
            function (cmp) {
              console.log("lwc has been initiated!");
            },
            lightningEndpoint
          );
        });
      }
    </script>
