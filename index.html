<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uppsögn</title>
    <script src="https://syn--vlocrenan.sandbox.my.site.com/service/lightning/lightning.out.js"></script>
  </head>

  <body>
    <div id="container"></div>
    <script>
      const appName = "c:rcpExternalApprovalAuraContainer";
      const componentName = "c:rcpExternalApprovalContainer";
      const lightningEndpoint = "https://syn--vlocrenan.sandbox.my.site.com/service";
      const targetElement = document.querySelector("#container");

      const urlParams = new URLSearchParams(window.location.search);
      
        const uuid = urlParams.get('cId');
        const actionType = urlParams.get('action');
        const componentAttributes = {
			      uuid,
            actionType
        };
          
        $Lightning.use(appName, function () {
          $Lightning.createComponent(
            componentName,
            componentAttributes,
            targetElement,
            function (cmp) {
              console.log("lwc has been initiated!");
            }
          );
        },lightningEndpoint);
    </script>
  </body>
</html>
